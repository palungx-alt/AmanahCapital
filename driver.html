<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amanah Capital - Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        
        /* Animasi Loading */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom Scrollbar for Dropdown */
        select option { padding: 12px; font-size: 16px; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="gradient-bg text-white shadow-lg sticky top-0 z-50 px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                <i data-lucide="truck" class="w-6 h-6 text-emerald-300"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Driver Portal</h1>
                <p id="driver-name-display" class="text-xs text-emerald-200 opacity-90">Memuat nama...</p>
            </div>
        </div>
        <button onclick="logout()" class="bg-white/10 hover:bg-red-500/80 p-2 rounded-lg transition backdrop-blur-sm border border-white/20">
            <i data-lucide="log-out" class="w-5 h-5 text-white"></i>
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4 pb-24">
        
        <!-- STATUS CARD -->
        <div class="glass-card p-4 rounded-2xl shadow-sm border-l-4 border-l-emerald-500 flex items-center justify-between">
            <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Koneksi</p>
                <div class="flex items-center gap-2 mt-1">
                    <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="conn-text" class="text-sm font-semibold text-slate-700">Online & Siap Input</span>
                </div>
            </div>
            <div id="clock" class="text-2xl font-mono font-bold text-slate-600">--:--</div>
        </div>

        <!-- FORM INPUT TRANSAKSI (ADD TO CART) -->
        <form id="driver-form" class="glass-card p-5 rounded-2xl shadow-sm space-y-5">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 pb-2 border-b border-slate-100">
                <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Tambah Item ke Nota
            </h2>

            <!-- Tanggal Otomatis -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Tanggal Transaksi</label>
                <input type="date" id="form-date" required readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 cursor-not-allowed">
            </div>

            <!-- Pilih Vendor / Bank Sampah -->
            <div>
                <div class="flex justify-between items-end mb-1.5">
                    <label class="block text-xs font-bold uppercase text-slate-500">Nama Bank Sampah / Vendor</label>
                    <button type="button" onclick="openAddClientModal()" class="text-[10px] text-blue-600 font-bold flex items-center gap-1 hover:text-blue-800">
                        <i data-lucide="plus" class="w-3 h-3"></i> Tambah Baru
                    </button>
                </div>
                <select id="form-vendor" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white appearance-none">
                    <option value="">-- Pilih Vendor --</option>
                </select>
                <div class="relative pointer-events-none absolute right-8 top-[38px]">
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                </div>
            </div>

            <!-- Dropdown Jenis Sampah (Dari Master Data) -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Jenis Sampah</label>
                <select id="form-item" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white appearance-none">
                    <option value="">-- Pilih Jenis Sampah --</option>
                </select>
                <div class="relative pointer-events-none absolute right-8 top-[102px]">
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                </div>
            </div>

            <!-- Grid Qty & Total -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Berat (Kg)</label>
                    <input type="number" id="form-qty" inputmode="decimal" step="0.1" required placeholder="0.0" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Total Harga (Rp)</label>
                    <input type="text" id="form-total" readonly placeholder="0" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 cursor-not-allowed font-mono">
                </div>
            </div>

            <!-- Tombol Tambah ke Keranjang -->
            <button type="button" id="btn-add-cart" onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 text-base">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i> Tambah ke Nota Sementara
            </button>
        </form>

        <!-- HISTORI / PREVIEW NOTA SEMENTARA -->
        <div id="cart-section" class="glass-card p-5 rounded-2xl shadow-sm hidden">
            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-500"></i> Preview Nota Hari Ini
                </h3>
                <span id="cart-count-badge" class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full">0 Item</span>
            </div>
            
            <div id="cart-list" class="space-y-2 max-h-60 overflow-y-auto pr-1 mb-4">
                <!-- List item akan dirender di sini -->
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center mb-4">
                <span class="text-xs font-bold text-slate-500 uppercase">Total Keseluruhan</span>
                <span id="cart-grand-total" class="text-lg font-bold text-blue-700 font-mono">Rp 0</span>
            </div>

            <!-- Tombol Simpan Batch ke Server -->
            <button type="button" id="btn-save-batch" onclick="saveBatchToServer()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-base">
                <i data-lucide="save" class="w-5 h-5"></i> Simpan Transaksi (Kirim ke Admin)
            </button>
        </div>

    </main>

    <!-- MODAL TAMBAH CLIENT BARU -->
    <div id="add-client-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl relative border border-slate-100 modal-enter">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-blue-600"></i> Tambah Vendor Baru
                </h3>
                <button onclick="closeAddClientModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="add-client-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Vendor / BSU</label>
                    <input type="text" id="new-client-name" required placeholder="Contoh: BSU Melati Jaya" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Alamat (Opsional)</label>
                    <textarea id="new-client-address" rows="2" placeholder="Alamat lengkap..." class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none resize-none"></textarea>
                </div>
                <button type="submit" id="btn-save-new-client" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Vendor
                </button>
            </form>
        </div>
    </div>

    <!-- NOTIFIKASI TOAST -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium hidden z-50 flex items-center gap-2 transition-all duration-300">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
        <span id="toast-msg">Berhasil disimpan!</span>
    </div>

    <script>
        // URL API SUDAH TERINTEGRASI OTOMATIS
        const API_URL = "https://script.google.com/macros/s/AKfycbzytUMm5QHJcabvSGb__5Fl8R4bEoiGtwXsKFnbti80EM8ci7_jrKPTRr_LD7nWiMKM/exec";
        
        let masterItems = [];
        let cachedClients = [];
        let transactionCart = []; // Keranjang transaksi lokal
        let localHistory = JSON.parse(localStorage.getItem('driver_history') || '[]');

        // ==================== INITIALIZATION ====================
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            checkAuth();
            updateClock();
            setInterval(updateClock, 60000);
            
            // Set tanggal hari ini
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('form-date').value = today;

            // Load Data Awal
            loadMasterDataForDropdown();
            loadClientsForDropdown();

            // Event Listeners untuk Auto Calc
            document.getElementById('form-item').addEventListener('change', calculateTotal);
            document.getElementById('form-qty').addEventListener('input', calculateTotal);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        // ==================== AUTHENTICATION CHECK ====================
        function checkAuth() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const driverName = decodeURIComponent(params.get('driverName') || 'Driver');

            if (!token) {
                alert("Akses tidak sah! Silakan login melalui halaman utama.");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('driver-name-display').innerText = `Halo, ${driverName}`;
            sessionStorage.setItem('driver_session', token);
        }

        function logout() {
            if(confirm("Yakin ingin keluar?")) {
                sessionStorage.removeItem('driver_session');
                window.location.href = 'index.html';
            }
        }

        // ==================== DATA LOADING ====================
        async function loadMasterDataForDropdown() {
            const select = document.getElementById('form-item');
            try {
                const res = await fetch(`${API_URL}?action=getMasterData`).then(r => r.json());
                
                if (res.status === 'success') {
                    masterItems = res.items.map(item => ({
                        ...item,
                        price: parseFloat(item.price) || 0
                    }));

                    // Sort alfabetis
                    masterItems.sort((a, b) => a.name.localeCompare(b.name));

                    // Populate Dropdown
                    masterItems.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.name;
                        opt.text = `${item.name} (Rp ${formatNumber(item.price)})`;
                        opt.dataset.price = item.price;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
                showToast("Gagal memuat daftar sampah.", true);
                document.getElementById('conn-dot').className = "w-2.5 h-2.5 rounded-full bg-red-500";
                document.getElementById('conn-text').innerText = "Offline / Error";
            }
        }

        async function loadClientsForDropdown() {
            const select = document.getElementById('form-vendor');
            try {
                const res = await fetch(`${API_URL}?action=getClients`).then(r => r.json());
                
                if (res.status === 'success') {
                    cachedClients = res.clients;
                    
                    // Populate Dropdown
                    cachedClients.forEach(client => {
                        const opt = document.createElement('option');
                        opt.value = client.name;
                        opt.text = client.name;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
                showToast("Gagal memuat daftar vendor.", true);
            }
        }

        // ==================== CALCULATION LOGIC ====================
        function calculateTotal() {
            const select = document.getElementById('form-item');
            const qtyInput = document.getElementById('form-qty');
            const totalInput = document.getElementById('form-total');

            const selectedOpt = select.options[select.selectedIndex];
            const price = parseFloat(selectedOpt.dataset.price) || 0;
            const qty = parseFloat(qtyInput.value) || 0;

            const total = price * qty;
            totalInput.value = formatNumber(total);
        }

        // ==================== ADD CLIENT MODAL LOGIC ====================
        function openAddClientModal() {
            document.getElementById('add-client-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeAddClientModal() {
            document.getElementById('add-client-modal').classList.add('hidden');
            document.getElementById('add-client-form').reset();
        }

        document.getElementById('add-client-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-new-client');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent"></div>';

            const clientData = {
                name: document.getElementById('new-client-name').value.trim().toUpperCase(),
                address: document.getElementById('new-client-address').value.trim(),
                npwp: '',
                phone: ''
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'addClient', clientData: clientData })
                });

                showToast("Vendor berhasil ditambahkan!");
                
                // Refresh dropdown clients
                const select = document.getElementById('form-vendor');
                select.innerHTML = '<option value="">-- Pilih Vendor --</option>';
                cachedClients.push({name: clientData.name}); 
                cachedClients.sort((a,b) => a.name.localeCompare(b.name));
                
                cachedClients.forEach(client => {
                    const opt = document.createElement('option');
                    opt.value = client.name;
                    opt.text = client.name;
                    select.appendChild(opt);
                });
                
                // Auto select vendor baru
                select.value = clientData.name;

                closeAddClientModal();
            } catch (err) {
                showToast("Gagal menambah vendor.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // ==================== KERANJANG TRANSAKSI (CART LOGIC) ====================
        function addToCart() {
            const vendor = document.getElementById('form-vendor').value.trim().toUpperCase();
            const itemName = document.getElementById('form-item').value;
            const date = document.getElementById('form-date').value;
            const qty = parseFloat(document.getElementById('form-qty').value);
            
            if(!vendor || !itemName || !qty) {
                showToast("Lengkapi semua data!", true);
                return;
            }

            // Ambil harga satuan dari dropdown
            const select = document.getElementById('form-item');
            const itemPrice = parseFloat(select.options[select.selectedIndex].dataset.price) || 0;
            const total = qty * itemPrice;

            // LOGIKA MERGE LOKAL: Cek apakah item & vendor sama sudah ada di keranjang
            const existingItemIndex = transactionCart.findIndex(item => 
                item.vendor === vendor && item.itemName === itemName
            );

            if (existingItemIndex !== -1) {
                // Jika ada, tambahkan qty dan totalnya (Merge)
                transactionCart[existingItemIndex].qty += qty;
                transactionCart[existingItemIndex].total += total;
                showToast(`${itemName} digabung! Total jadi ${transactionCart[existingItemIndex].qty} Kg`);
            } else {
                // Jika tidak ada, buat baru
                transactionCart.push({
                    id: `TEMP-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                    date: date,
                    vendor: vendor,
                    itemName: itemName,
                    qty: qty,
                    price: itemPrice,
                    total: total
                });
                showToast(`${itemName} (${qty} Kg) ditambahkan ke nota.`);
            }

            // Reset form input item saja (tanggal & vendor tetap)
            document.getElementById('form-item').value = "";
            document.getElementById('form-qty').value = "";
            document.getElementById('form-total').value = "";
            
            renderCart();
        }

        function removeFromCart(tempId) {
            transactionCart = transactionCart.filter(item => item.id !== tempId);
            renderCart();
            showToast("Item dihapus dari nota sementara.");
        }

        function renderCart() {
            const cartSection = document.getElementById('cart-section');
            const cartList = document.getElementById('cart-list');
            const countBadge = document.getElementById('cart-count-badge');
            const grandTotalEl = document.getElementById('cart-grand-total');

            if (transactionCart.length === 0) {
                cartSection.classList.add('hidden');
                return;
            }

            cartSection.classList.remove('hidden');
            countBadge.innerText = `${transactionCart.length} Item`;

            let grandTotal = 0;
            cartList.innerHTML = transactionCart.map(item => {
                grandTotal += item.total;
                return `
                <div class="flex justify-between items-start p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs group">
                    <div class="flex-1">
                        <p class="font-bold text-slate-700">${item.itemName}</p>
                        <p class="text-slate-500 mt-0.5">${item.vendor} • ${new Date(item.date).toLocaleDateString('id-ID')}</p>
                        <p class="font-mono text-blue-600 mt-1">${formatNumber(item.qty)} Kg x ${formatIDR(item.price)}</p>
                    </div>
                    <div class="text-right ml-2 flex flex-col items-end gap-2">
                        <p class="font-bold text-slate-800 font-mono">${formatIDR(item.total)}</p>
                        <button onclick="removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600 p-1 opacity-0 group-hover:opacity-100 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');

            grandTotalEl.innerText = formatIDR(grandTotal);
            lucide.createIcons();
        }

        // ==================== SIMPAN BATCH KE SERVER ====================
        async function saveBatchToServer() {
            if(transactionCart.length === 0) return;
            
            const btn = document.getElementById('btn-save-batch');
            const originalBtnContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent"></div> Mengirim...';

            try {
                // Kirim setiap item di keranjang ke backend satu per satu
                // Backend akan menyimpannya dengan status 'Pending' dan Timestamp
                for(const item of transactionCart) {
                    const rowData = [
                        `DRV-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`, 
                        item.date, 
                        'Material', 
                        item.itemName, 
                        item.qty, 
                        item.price, 
                        item.total, 
                        item.vendor, 
                        'Pending', // Status default Pending
                        `Input ${new Date().toISOString()}` // Timestamp untuk pengingat
                    ];

                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            targetSheet: 'PEMBELIAN',
                            rowData: rowData
                        })
                    });
                }

                showToast(`Berhasil! ${transactionCart.length} item tersimpan & menunggu approval.`);
                
                // Simpan ke riwayat lokal
                addToHistory(transactionCart.length);
                
                // Kosongkan keranjang
                transactionCart = [];
                renderCart();
                
                // Opsional: Reset vendor juga jika mau ganti nota baru
                // document.getElementById('form-vendor').value = "";
                
            } catch (err) {
                console.error(err);
                showToast("Gagal menyimpan. Coba lagi.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        }

        // ==================== HELPER FUNCTIONS ====================
        function formatNumber(num) {
            return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num || 0);
        }

        function formatIDR(v) { 
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v || 0); 
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');
            
            msgEl.innerText = msg;
            
            if(isError) {
                toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium z-50 flex items-center gap-2 transition-all duration-300";
                icon.setAttribute('data-lucide', 'alert-circle');
                icon.className = "w-4 h-4 text-white";
            } else {
                toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium z-50 flex items-center gap-2 transition-all duration-300";
                icon.setAttribute('data-lucide', 'check-circle');
                icon.className = "w-4 h-4 text-emerald-400";
            }
            
            lucide.createIcons();
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        function addToHistory(count) {
            localHistory.unshift({ 
                count: count, 
                time: new Date().toLocaleTimeString('id-ID'),
                vendor: document.getElementById('form-vendor').value 
            });
            if(localHistory.length > 5) localHistory.pop(); 
            localStorage.setItem('driver_history', JSON.stringify(localHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if(localHistory.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center italic py-2">Belum ada transaksi hari ini.</p>';
                return;
            }
            
            container.innerHTML = localHistory.map(h => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs">
                    <div>
                        <p class="font-bold text-slate-700">${h.count} Item Disimpan</p>
                        <p class="text-slate-500">${h.vendor}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-bold text-emerald-600">Pending</p>
                        <p class="text-slate-400">${h.time}</p>
                    </div>
                </div>
