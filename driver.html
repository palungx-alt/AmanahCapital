<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amanah Capital - Driver App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        select option { padding: 12px; font-size: 16px; }
        
        /* Animasi Cart */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col relative">

    <!-- HEADER -->
    <header class="gradient-bg text-white shadow-lg sticky top-0 z-40 px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm"><i data-lucide="truck" class="w-6 h-6 text-emerald-300"></i></div>
            <div><h1 class="font-bold text-lg leading-tight">Driver Portal</h1><p id="driver-name-display" class="text-xs text-emerald-200 opacity-90">Memuat nama...</p></div>
        </div>
        <button onclick="logout()" class="bg-white/10 hover:bg-red-500/80 p-2 rounded-lg transition backdrop-blur-sm border border-white/20"><i data-lucide="log-out" class="w-5 h-5 text-white"></i></button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4 pb-24">
        
        <!-- STATUS CARD -->
        <div class="glass-card p-4 rounded-2xl shadow-sm border-l-4 border-l-emerald-500 flex items-center justify-between">
            <div><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Koneksi</p><div class="flex items-center gap-2 mt-1"><span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span><span id="conn-text" class="text-sm font-semibold text-slate-700">Online & Siap Input</span></div></div>
            <div id="clock" class="text-2xl font-mono font-bold text-slate-600">--:--</div>
        </div>

        <!-- FORM INPUT TRANSAKSI (ADD TO CART) -->
        <form id="driver-form" class="glass-card p-5 rounded-2xl shadow-sm space-y-5">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 pb-2 border-b border-slate-100"><i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Tambah Item ke Nota</h2>

            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Tanggal Transaksi</label><input type="date" id="form-date" required readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 cursor-not-allowed"></div>

            <div>
                <div class="flex justify-between items-end mb-1.5">
                    <label class="block text-xs font-bold uppercase text-slate-500">Nama Bank Sampah / Vendor</label>
                    <button type="button" onclick="openAddClientModal()" class="text-[10px] text-blue-600 font-bold flex items-center gap-1 hover:text-blue-800"><i data-lucide="plus" class="w-3 h-3"></i> Tambah Baru</button>
                </div>
                <select id="form-vendor" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white appearance-none"><option value="">-- Pilih Vendor --</option></select>
                <div class="relative pointer-events-none absolute right-8 top-[108px]"><i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i></div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Jenis Sampah</label>
                <select id="form-item" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white appearance-none"><option value="">-- Pilih Jenis Sampah --</option></select>
                <div class="relative pointer-events-none absolute right-8 top-[172px]"><i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Berat (Kg)</label><input type="number" id="form-qty" inputmode="decimal" step="0.1" required placeholder="0.0" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white font-mono"></div>
                <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Total Harga (Rp)</label><input type="text" id="form-total" readonly placeholder="0" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 cursor-not-allowed font-mono"></div>
            </div>

            <!-- TOMBOL ADD TO CART (BUKAN SUBMIT LANGSUNG) -->
            <button type="button" id="btn-add-cart" onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 text-base"><i data-lucide="shopping-cart" class="w-5 h-5"></i> Tambah ke Nota Sementara</button>
        </form>

        <!-- KERANJANG / PREVIEW NOTA SEMENTARA -->
        <div id="cart-section" class="glass-card p-5 rounded-2xl shadow-sm hidden animate-slide-up">
            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-amber-500"></i> Preview Nota Hari Ini</h3>
                <span id="cart-count-badge" class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full">0 Item</span>
            </div>
            
            <div id="cart-list" class="space-y-2 max-h-60 overflow-y-auto pr-1 mb-4"></div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center mb-4">
                <span class="text-xs font-bold text-slate-500 uppercase">Total Keseluruhan</span>
                <span id="cart-grand-total" class="text-lg font-bold text-blue-700 font-mono">Rp 0</span>
            </div>

            <!-- TOMBOL CHECKOUT (SUBMIT KE SHEET) -->
            <button type="button" id="btn-save-batch" onclick="saveBatchToServer()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-base"><i data-lucide="save" class="w-5 h-5"></i> Simpan Transaksi (Kirim ke Admin)</button>
        </div>

        <!-- RIWAYAT SINGKAT -->
        <div class="glass-card p-4 rounded-2xl shadow-sm">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-3">Riwayat Input Terakhir</h3>
            <div id="history-list" class="space-y-2"><p class="text-xs text-slate-400 text-center italic py-2">Belum ada transaksi hari ini.</p></div>
        </div>

    </main>

    <!-- MODAL TAMBAH CLIENT BARU (DENGAN NO TELP) -->
    <div id="add-client-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl relative border border-slate-100 modal-enter">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="user-plus" class="w-5 h-5 text-blue-600"></i> Tambah Vendor Baru</h3>
                <button onclick="closeAddClientModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="add-client-form" class="space-y-4">
                <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Vendor / BSU</label><input type="text" id="new-client-name" required placeholder="Contoh: BSU Melati Jaya" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none uppercase"></div>
                
                <!-- FIELD NO TELP OPSIONAL -->
                <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">No. Telepon (Opsional)</label><input type="tel" id="new-client-phone" placeholder="0812..." class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none"></div>
                
                <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Alamat (Opsional)</label><textarea id="new-client-address" rows="2" placeholder="Alamat lengkap..." class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none resize-none"></textarea></div>
                <button type="submit" id="btn-save-new-client" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan Vendor</button>
            </form>
        </div>
    </div>

    <!-- NOTIFIKASI TOAST -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium hidden z-50 flex items-center gap-2 transition-all duration-300"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i><span id="toast-msg">Berhasil disimpan!</span></div>

    <script>
        // URL API ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbzytUMm5QHJcabvSGb__5Fl8R4bEoiGtwXsKFnbti80EM8ci7_jrKPTRr_LD7nWiMKM/exec";
        
        // VARIABEL GLOBAL UNTUK KERANJANG
        let masterItems = [], cachedClients = [], transactionCart = [];
        let localHistory = JSON.parse(localStorage.getItem('driver_history') || '[]');

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons(); checkAuth(); updateClock(); setInterval(updateClock, 60000);
            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            
            // LOAD DATA DROPDOWN (LOGIKA LAMA ANDA TETAP JALAN DI SINI)
            loadMasterDataForDropdown(); 
            loadClientsForDropdown(); 
            renderHistory();
            
            document.getElementById('form-item').addEventListener('change', calculateTotal);
            document.getElementById('form-qty').addEventListener('input', calculateTotal);
        });

        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }

        function checkAuth() {
            const params = new URLSearchParams(window.location.search);
            if (!params.get('token')) { alert("Akses tidak sah!"); window.location.href = 'index.html'; return; }
            document.getElementById('driver-name-display').innerText = `Halo, ${decodeURIComponent(params.get('bsName') || 'Driver')}`;
        }

        function logout() { if(confirm("Yakin ingin keluar?")) { sessionStorage.removeItem('driver_session'); window.location.href = 'index.html'; } }

        // --- LOGIKA DROPDOWN TETAP SAMA SEPERTI SEBELUMNYA ---
        async function loadMasterDataForDropdown() {
            try {
                const res = await fetch(`${API_URL}?action=getMasterData`).then(r => r.json());
                if (res.status === 'success') {
                    masterItems = res.items.map(i => ({...i, price: parseFloat(i.price)||0})).sort((a,b)=>a.name.localeCompare(b.name));
                    const select = document.getElementById('form-item');
                    masterItems.forEach(item => {
                        const opt = document.createElement('option'); opt.value = item.name; opt.text = `${item.name} (Rp ${formatNumber(item.price)})`; opt.dataset.price = item.price; select.appendChild(opt);
                    });
                }
            } catch (err) { showToast("Gagal memuat daftar sampah.", true); }
        }

        async function loadClientsForDropdown() {
            try {
                const res = await fetch(`${API_URL}?action=getClients`).then(r => r.json());
                if (res.status === 'success') {
                    cachedClients = res.clients;
                    const select = document.getElementById('form-vendor');
                    cachedClients.forEach(c => { const opt = document.createElement('option'); opt.value = c.name; opt.text = c.name; select.appendChild(opt); });
                }
            } catch (err) { showToast("Gagal memuat vendor.", true); }
        }

        function calculateTotal() {
            const price = parseFloat(document.getElementById('form-item').options[document.getElementById('form-item').selectedIndex].dataset.price) || 0;
            const qty = parseFloat(document.getElementById('form-qty').value) || 0;
            document.getElementById('form-total').value = formatNumber(price * qty);
        }

        // --- MODAL CLIENT DENGAN NO TELP ---
        function openAddClientModal() { document.getElementById('add-client-modal').classList.remove('hidden'); lucide.createIcons(); }
        function closeAddClientModal() { document.getElementById('add-client-modal').classList.add('hidden'); document.getElementById('add-client-form').reset(); }
        
        document.getElementById('add-client-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-new-client');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent"></div>';
            
            const clientData = {
                name: document.getElementById('new-client-name').value.trim().toUpperCase(),
                phone: document.getElementById('new-client-phone').value.trim(), // Data No Telp
                address: document.getElementById('new-client-address').value.trim()
            };

            try {
                // Panggil action addClient di backend
                await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'addClient', clientData }) });
                showToast("Vendor berhasil ditambahkan!");
                
                // Update dropdown lokal tanpa reload
                cachedClients.push({name: clientData.name});
                const select = document.getElementById('form-vendor');
                select.innerHTML = '<option value="">-- Pilih Vendor --</option>';
                cachedClients.sort((a,b)=>a.name.localeCompare(b.name)).forEach(c => { const opt = document.createElement('option'); opt.value = c.name; opt.text = c.name; select.appendChild(opt); });
                select.value = clientData.name;
                closeAddClientModal();
            } catch (err) { showToast("Gagal menambah vendor.", true); }
            finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Simpan Vendor'; }
        });

        // --- LOGIKA KERANJANG (CART) & AUTO MERGE ---
        function addToCart() {
            const vendor = document.getElementById('form-vendor').value.trim().toUpperCase();
            const itemName = document.getElementById('form-item').value;
            const date = document.getElementById('form-date').value;
            const qty = parseFloat(document.getElementById('form-qty').value);
            
            if(!vendor || !itemName || !qty) return showToast("Lengkapi semua data!", true);

            const itemPrice = parseFloat(document.getElementById('form-item').options[document.getElementById('form-item').selectedIndex].dataset.price) || 0;
            const total = qty * itemPrice;

            // AUTO MERGE: Cek apakah item & vendor sama sudah ada di keranjang
            const existingIndex = transactionCart.findIndex(item => item.vendor === vendor && item.itemName === itemName);

            if (existingIndex !== -1) {
                transactionCart[existingIndex].qty += qty;
                transactionCart[existingIndex].total += total;
                showToast(`${itemName} digabung! Total jadi ${transactionCart[existingIndex].qty} Kg`);
            } else {
                transactionCart.push({ id: `TEMP-${Date.now()}`, date, vendor, itemName, qty, price: itemPrice, total });
                showToast(`${itemName} (${qty} Kg) ditambahkan.`);
            }

            // Reset input item & qty saja
            document.getElementById('form-item').value = "";
            document.getElementById('form-qty').value = "";
            document.getElementById('form-total').value = "";
            renderCart();
        }

        function removeFromCart(id) {
            transactionCart = transactionCart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const section = document.getElementById('cart-section');
            const list = document.getElementById('cart-list');
            const badge = document.getElementById('cart-count-badge');
            const grandTotalEl = document.getElementById('cart-grand-total');

            if (transactionCart.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            badge.innerText = `${transactionCart.length} Item`;

            let grandTotal = 0;
            list.innerHTML = transactionCart.map(item => {
                grandTotal += item.total;
                return `<div class="flex justify-between items-start p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs group">
                    <div class="flex-1">
                        <p class="font-bold text-slate-700">${item.itemName}</p>
                        <p class="text-slate-500 mt-0.5">${item.vendor} • ${new Date(item.date).toLocaleDateString('id-ID')}</p>
                        <p class="font-mono text-blue-600 mt-1">${formatNumber(item.qty)} Kg x ${formatIDR(item.price)}</p>
                    </div>
                    <div class="text-right ml-2 flex flex-col items-end gap-2">
                        <p class="font-bold text-slate-800 font-mono">${formatIDR(item.total)}</p>
                        <button onclick="removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600 p-1 opacity-0 group-hover:opacity-100 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>`;
            }).join('');

            grandTotalEl.innerText = formatIDR(grandTotal);
            lucide.createIcons();
        }

        // --- CHECKOUT BATCH KE SERVER ---
        async function saveBatchToServer() {
            if(transactionCart.length === 0) return;
            const btn = document.getElementById('btn-save-batch');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent"></div> Mengirim...';

            try {
                // Kirim seluruh isi keranjang sekaligus ke backend
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'checkoutDriverCart', cartItems: transactionCart })
                });

                showToast(`Berhasil! ${transactionCart.length} item tersimpan.`);
                addToHistory(transactionCart.length);
                transactionCart = [];
                renderCart();
            } catch (err) { showToast("Gagal menyimpan.", true); }
            finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-5 h-5"></i> Simpan Transaksi'; }
        }

        // HELPERS
        function formatNumber(num) { return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num || 0); }
        function formatIDR(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(v || 0); }
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 ${isError ? 'bg-red-600' : 'bg-slate-800'} text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium z-50 flex items-center gap-2 transition-all duration-300`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function addToHistory(count) {
            localHistory.unshift({ count, time: new Date().toLocaleTimeString('id-ID'), vendor: document.getElementById('form-vendor').value });
            if(localHistory.length > 5) localHistory.pop(); 
            localStorage.setItem('driver_history', JSON.stringify(localHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if(localHistory.length === 0) { container.innerHTML = '<p class="text-xs text-slate-400 text-center italic py-2">Belum ada transaksi.</p>'; return; }
            container.innerHTML = localHistory.map(h => `<div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs"><div><p class="font-bold text-slate-700">${h.count} Item Disimpan</p><p class="text-slate-500">${h.vendor}</p></div><div class="text-right"><p class="font-mono font-bold text-emerald-600">Pending</p><p class="text-slate-400">${h.time}</p></div></div>`).join('');
        }
    </script>
</body>
</html>
